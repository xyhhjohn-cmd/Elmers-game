<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Elmers Game</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #238238;
}

/* ROAD */

#road {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: min(75vw, 430px);
    height: 100%;
    background: #333;
    border-left: 7px solid white;
    border-right: 7px solid white;
    overflow: hidden;
}

/* ROAD LINES */

.line {
    position: absolute;
    width: 8px;
    height: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
}

/* HUD */

#hud {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 50;

    color: white;
    font-size: 17px;
    font-weight: bold;

    text-shadow:
        2px 2px 3px black;
}

#hud div {
    margin-bottom: 5px;
}

/* CAR */

.car {
    position: absolute;
    width: 50px;
    height: 82px;
    border-radius: 10px;
}

/* PLAYER */

#player {
    position: absolute;
    width: 50px;
    height: 82px;

    background: #e53935;

    border-radius: 10px;

    z-index: 20;

    box-shadow:
        inset 7px 0 #a50000,
        inset -7px 0 #a50000;
}

/* PLAYER WINDOW */

#player::before {
    content: "";

    position: absolute;

    width: 30px;
    height: 27px;

    left: 10px;
    top: 10px;

    background: #8ee8ff;

    border-radius: 5px;
}

/* PLAYER WHEELS */

#player::after {
    content: "";

    position: absolute;

    width: 6px;
    height: 20px;

    left: -5px;
    top: 18px;

    background: #111;

    box-shadow:
        54px 0 #111,
        0 35px #111,
        54px 35px #111;
}

/* ENEMY */

.enemy {
    background: #1976d2;

    box-shadow:
        inset 7px 0 #0d47a1,
        inset -7px 0 #0d47a1;
}

/* ENEMY WINDOW */

.enemy::before {
    content: "";

    position: absolute;

    width: 30px;
    height: 27px;

    left: 10px;
    top: 10px;

    background: #b9efff;

    border-radius: 5px;
}

/* CONTROLS */

#controls {
    position: absolute;

    bottom: 20px;
    left: 0;

    width: 100%;

    z-index: 60;

    display: flex;
    justify-content: space-between;

    padding: 0 25px;
}

.control {
    width: 75px;
    height: 75px;

    border-radius: 50%;

    border: 3px solid white;

    background: rgba(0,0,0,0.55);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
}

/* START SCREEN */

.screen {
    position: absolute;

    inset: 0;

    z-index: 100;

    background: rgba(0,0,0,0.88);

    color: white;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;
}

.screen h1 {
    font-size: 42px;

    margin-bottom: 10px;
}

.screen p {
    margin-bottom: 8px;
}

/* BUTTON */

button {
    margin-top: 18px;

    padding: 14px 28px;

    border: none;

    border-radius: 10px;

    background: #e53935;

    color: white;

    font-size: 19px;

    font-weight: bold;
}

/* GAME OVER */

#gameOver {
    display: none;
}

</style>
</head>

<body>

<div id="game">

    <!-- ROAD -->

    <div id="road">

        <div class="line" style="top: -100px;"></div>
        <div class="line" style="top: 100px;"></div>
        <div class="line" style="top: 300px;"></div>
        <div class="line" style="top: 500px;"></div>
        <div class="line" style="top: 700px;"></div>

    </div>


    <!-- HUD -->

    <div id="hud">

        <div>🏁 ELMERS GAME</div>

        <div>
            Score:
            <span id="score">0</span>
        </div>

        <div>
            Speed:
            <span id="speed">1</span>
        </div>

    </div>


    <!-- PLAYER -->

    <div id="player"></div>


    <!-- CONTROLS -->

    <div id="controls">

        <div
            class="control"
            id="leftButton">
            ◀
        </div>

        <div
            class="control"
            id="rightButton">
            ▶
        </div>

    </div>


    <!-- START -->

    <div
        class="screen"
        id="startScreen">

        <h1>
            🏎️ ELMERS GAME
        </h1>

        <p>
            2D Racing Game
        </p>

        <p>
            Avoid the enemy cars!
        </p>

        <button id="startButton">
            START RACE
        </button>

    </div>


    <!-- GAME OVER -->

    <div
        class="screen"
        id="gameOver">

        <h1>
            💥 GAME OVER
        </h1>

        <p>
            Your Score:
            <span id="finalScore">
                0
            </span>
        </p>

        <button id="restartButton">
            RACE AGAIN
        </button>

    </div>

</div>


<script>

/* =========================
   GET ELEMENTS
========================= */

const game =
    document.getElementById("game");

const road =
    document.getElementById("road");

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const speedText =
    document.getElementById("speed");

const startScreen =
    document.getElementById("startScreen");

const gameOver =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const startButton =
    document.getElementById("startButton");

const restartButton =
    document.getElementById("restartButton");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");


/* =========================
   GAME VARIABLES
========================= */

let running = false;

let playerX = 0;

let roadLeft = 0;

let roadRight = 0;

let score = 0;

let gameSpeed = 5;

let enemies = [];

let lastEnemy = 0;

let animationID;


/* =========================
   START GAME
========================= */

function startGame() {

    /* Remove old enemies */

    for (let i = 0; i < enemies.length; i++) {

        enemies[i].element.remove();

    }

    enemies = [];


    /* Reset values */

    score = 0;

    gameSpeed = 5;

    scoreText.textContent = "0";

    speedText.textContent = "1";


    /* Get road position */

    const roadRect =
        road.getBoundingClientRect();

    roadLeft =
        roadRect.left;

    roadRight =
        roadRect.right;


    /* Put player in center */

    playerX =
        (roadLeft + roadRight) / 2
        - player.offsetWidth / 2;


    player.style.left =
        playerX + "px";

    player.style.top =
        (window.innerHeight - 130) + "px";


    /* Hide screens */

    startScreen.style.display =
        "none";

    gameOver.style.display =
        "none";


    /* Start */

    running = true;

    lastEnemy =
        performance.now();

    cancelAnimationFrame(animationID);

    animationID =
        requestAnimationFrame(gameLoop);
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(time) {

    if (!running) {
        return;
    }


    moveRoad();

    moveEnemies();

    createEnemy(time);

    checkCollision();


    animationID =
        requestAnimationFrame(gameLoop);
}


/* =========================
   ROAD
========================= */

function moveRoad() {

    const lines =
        document.querySelectorAll(".line");


    for (let i = 0; i < lines.length; i++) {

        let y =
            parseFloat(lines[i].style.top);


        y += gameSpeed;


        if (y > window.innerHeight) {

            y = -100;

        }


        lines[i].style.top =
            y + "px";
    }
}


/* =========================
   CREATE ENEMY
========================= */

function createEnemy(time) {

    /* Wait before spawning */

    if (time - lastEnemy < 900) {
        return;
    }


    lastEnemy = time;


    const enemy =
        document.createElement("div");

    enemy.className =
        "car enemy";


    const enemyWidth =
        50;


    const minX =
        roadLeft + 12;

    const maxX =
        roadRight -
        enemyWidth -
        12;


    const randomX =
        minX +
        Math.random() *
        (maxX - minX);


    enemy.style.left =
        randomX + "px";

    enemy.style.top =
        "-100px";


    game.appendChild(enemy);


    enemies.push({

        element: enemy,

        x: randomX,

        y: -100,

        speed:
            gameSpeed +
            Math.random() * 1.5

    });
}


/* =========================
   MOVE ENEMIES
========================= */

function moveEnemies() {

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy =
            enemies[i];


        enemy.y +=
            enemy.speed;


        enemy.element.style.top =
            enemy.y + "px";


        /* Enemy passed player */

        if (
            enemy.y >
            window.innerHeight + 100
        ) {

            enemy.element.remove();

            enemies.splice(i, 1);


            score++;

            scoreText.textContent =
                score;


            /* Increase speed */

            if (
                score > 0 &&
                score % 10 === 0
            ) {

                gameSpeed += 0.5;

                speedText.textContent =
                    Math.floor(
                        gameSpeed - 4
                    );
            }
        }
    }
}


/* =========================
   COLLISION
========================= */

function checkCollision() {

    const playerRect =
        player.getBoundingClientRect();


    for (let i = 0; i < enemies.length; i++) {

        const enemyRect =
            enemies[i]
            .element
            .getBoundingClientRect();


        const collision =

            playerRect.left <
            enemyRect.right &&

            playerRect.right >
            enemyRect.left &&

            playerRect.top <
            enemyRect.bottom &&

            playerRect.bottom >
            enemyRect.top;


        if (collision) {

            endGame();

            return;
        }
    }
}


/* =========================
   MOVE LEFT
========================= */

function moveLeft() {

    if (!running) {
        return;
    }


    playerX -= 25;


    if (
        playerX <
        roadLeft + 10
    ) {

        playerX =
            roadLeft + 10;
    }


    player.style.left =
        playerX + "px";
}


/* =========================
   MOVE RIGHT
========================= */

function moveRight() {

    if (!running) {
        return;
    }


    playerX += 25;


    const maxX =
        roadRight -
        player.offsetWidth -
        10;


    if (playerX > maxX) {

        playerX = maxX;
    }


    player.style.left =
        playerX + "px";
}


/* =========================
   TOUCH CONTROLS
========================= */

leftButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        moveLeft();

    },
    { passive: false }
);


rightButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        moveRight();

    },
    { passive: false }
);


/* =========================
   MOUSE CONTROLS
========================= */

leftButton.addEventListener(
    "mousedown",
    moveLeft
);

rightButton.addEventListener(
    "mousedown",
    moveRight
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "ArrowLeft"
        ) {

            moveLeft();

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            moveRight();

        }

    }
);


/* =========================
   GAME OVER
========================= */

function endGame() {

    running = false;


    cancelAnimationFrame(
        animationID
    );


    finalScore.textContent =
        score;


    gameOver.style.display =
        "flex";
}


/* =========================
   BUTTONS
========================= */

startButton.addEventListener(
    "click",
    startGame
);


restartButton.addEventListener(
    "click",
    startGame
);


/* =========================
   SCREEN RESIZE
========================= */

window.addEventListener(
    "resize",
    function() {

        if (!running) {
            return;
        }


        const roadRect =
            road.getBoundingClientRect();


        roadLeft =
            roadRect.left;

        roadRight =
            roadRect.right;


        if (
            playerX <
            roadLeft + 10
        ) {

            playerX =
                roadLeft + 10;
        }


        if (
            playerX >
            roadRight -
            player.offsetWidth -
            10
        ) {

            playerX =
                roadRight -
                player.offsetWidth -
                10;
        }


        player.style.left =
            playerX + "px";
    }
);

</script>

</body>
</html>
